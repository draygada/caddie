name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  solver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      # The toy fixture test has failed since part 16; part 19 slice 1 fixes it and removes this deselect.
      - run: uv run pytest --deselect tests/test_export.py::test_committed_toy_fixture_matches_a_fresh_solve

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
